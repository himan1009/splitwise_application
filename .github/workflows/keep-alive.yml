name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        env:
          URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Add GitHub secret BACKEND_HEALTH_URL = https://YOUR-BACKEND.onrender.com/health"
            exit 1
          fi

          case "$URL" in
            http://*|https://*) ;;
            *) echo "BACKEND_HEALTH_URL must start with http:// or https://"; exit 1 ;;
          esac

          if [[ "$URL" != */health ]]; then
            URL="${URL%/}/health"
          fi

          # Render may need 30–60s to wake. Any HTTP response still counts as traffic.
          for i in 1 2 3 4; do
            echo "Attempt $i: $URL"
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json || true
              exit 0
            fi
            if [ "$code" != "000" ] && [ "$code" != "" ]; then
              echo "Server responded (wake successful). Body:"
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 20
          done

          echo "Could not reach backend after retries"
          exit 1
